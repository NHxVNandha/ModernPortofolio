<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="N. favicon">
  <defs>
    <linearGradient id="bg" x1="9" y1="8" x2="55" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#adc6ff" />
      <stop offset="0.62" stop-color="#4edea3" />
      <stop offset="1" stop-color="#ffb786" stop-opacity="0.92" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
