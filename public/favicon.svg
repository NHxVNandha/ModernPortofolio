  <text x="12" y="44" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-2" filter="url(#glow)">N</text>
  <circle cx="48" cy="43" r="4" fill="#4edea3" />
</svg>
